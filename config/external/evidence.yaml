# The contradictions the trend list asks to keep (rule 35: both sides are shown, never averaged).
contradictions:
  - id: C-EU-electrification
    for: "Registrations: the battery electric share in the EU rose from 17.4 % (2025) to 21.7 % (January to August 2026)."
    against: "Stated intent: EY measures battery electric purchase intent 10 points lower, and Shell finds consideration in Europe unchanged at 40 %."
    claims: [EXT-P-01-1, EXT-P-02-1, EXT-T5-06-1, EXT-T5-05-1]
  - id: C-US-electrification
    for: "Hybrids grow: a record 16 % of US sales in the second quarter of 2026, and BCG expects full hybrids at 28 % in 2030."
    against: "Battery electric cars lose share: 6 % overall, and 14 % in the luxury segment after 22 % a year earlier."
    claims: [EXT-P-06-1, EXT-P-06-2, EXT-T5-02-1]
  - id: C-CN-electrification
    for: "The new energy share in China is at a record 65.2 % (August 2026)."
    against: "Plug-in hybrid and range-extender volumes fall at the same time (29.6 % and 22.2 % lower year on year)."
    claims: [EXT-P-04-1, EXT-E-21-1]
  - id: C-range-expectation
    for: "Customers accept about 480 km (S&P) and new flagship models offer more than 800 km (BMW iX3: 805 km WLTP)."
    against: "The sales-weighted average range of the electric cars actually sold is about 380 km and no longer rising (IEA)."
    claims: [EXT-T5-07-1, EXT-T5-03-2, EXT-T5-11-1, EXT-E-34-2]
  - id: C-cockpit-controls
    for: "Customers and several car makers go back to physical controls (S&P: 48 % prefer a mix; Volkswagen and others; a Chinese standard from 2027)."
    against: "BMW keeps the Neue Klasse cockpit digital and says nobody asked for the rotary controller back."
    claims: [EXT-T1-01-1, EXT-T1-02-1, EXT-T1-03-1, EXT-T1-04-1, EXT-T1-07-1]
  - id: C-CN-ai-cockpit
    for: "84 % of Chinese buyers expect a proactive AI assistant (McKinsey)."
    against: "56.5 % use AI-based vehicle control less because they do not trust its reliability (J.D. Power and Tongji)."
    claims: [EXT-T2-02-1, EXT-T1-07-2, EXT-E-54-2]
  - id: C-CN-fridge
    for: "The built-in fridge spreads: about 7 % of new energy cars in China in 2024."
    against: "How much it is used is disputed: the 5 % usage figure comes from one executive, without source or definition."
    claims: [EXT-T6-07-1, EXT-T6-08-1]
  - id: C-CN-zero-gravity-seat
    for: "The zero-gravity seat spreads fast in China (32 models in 2022, 117 in 2024)."
    against: "A safety backlash against the reclined seating position has begun."
    claims: [EXT-T6-01-1, EXT-T6-02-1]
  - id: C-CN-leather
    for: "In the West sustainability is read as recyclable, leather-free materials."
    against: "In China leather seats are becoming standard in the mid-range, and leather production grows."
    claims: [EXT-T7-01-1, EXT-T7-04-1]
  # not in the trend list: the testers of our own vehicle disagree
  - id: C-G60-infotainment-experts
    for: "What Car? calls the infotainment of the 5 Series class-leading, and Auto Express finds iDrive simplified."
    against: "Autocar calls it convoluted and reports that all testers had to look away from the road; ADAC names weak points in operation."
    claims: [EXT-E-03-1, EXT-E-30-1, EXT-E-29-1, EXT-E-25-1]
