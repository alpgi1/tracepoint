# The twelve vehicle subsystems of the Change Prediction Method (Clarkson, Simons, Eckert 2004)
# as used by cost/cpm_engine.py. Read by the backend effort engine and by
# frontend/scripts/build-cpm.py (frontend/content/cpm.json).
#
# ASSUMPTIONS, NOT CALIBRATED (effort rule 50): every weight, likelihood and impact below is the
# team's estimate from public cost breakdowns (Thunder Said Energy 2024, Bosch 2020) and the
# back-test against eight documented BMW decisions. BMW engineering or a mentor may change any
# value; every change is logged by the engine.
#
# weight:      share of a new vehicle's development effort; the twelve weights sum to 100.
# links:       direct propagation links from this subsystem: likelihood that a change here forces
#              a change in the target (0 to 1) and the share of the target's design work redone (0 to 1).
# certification_trigger: a change with own impact of 0.3 or more re-runs crash, emission or range
#              tests and adds the certification add-on.
method:
  name: Change Prediction Method
  reference: Clarkson, Simons, Eckert (2004), Predicting Change Propagation in Complex Design, Journal of Mechanical Design 126(5)
  url: https://oro.open.ac.uk/18626
  engine: cost/cpm_engine.py
  basis: assumption, not calibrated
  weight_sources:
    - Thunder Said Energy (2024), EV vs ICE cost breakdown by component (drivetrain about 30 to 36 % of vehicle cost)
    - Bosch (2020), electronics share of premium vehicle component cost (16 % in 2020, 35 % expected by 2025)
  thresholds:
    adapt_below_percent: 15
    new_generation_from_percent: 50
  certification_add_on_percent: 12
  carryover_likelihood_multiplier: 0.3
  max_path_length: 3

subsystems:
  - key: body_structure
    name: Body / structure
    scope: Body-in-white, doors, hood, roof, glazing, closures, wipers, restraints and body hardware
    weight: 18
    certification_trigger: true
    links:
      - {to: interior_console, likelihood: 0.5, impact: 0.3}
      - {to: exterior_design, likelihood: 0.4, impact: 0.3}
      - {to: chassis, likelihood: 0.5, impact: 0.4}
  - key: chassis
    name: Chassis
    scope: Suspension, steering, brakes, wheels and tyres, ride and handling
    weight: 10
    certification_trigger: false
    links:
      - {to: body_structure, likelihood: 0.3, impact: 0.2}
  - key: powertrain
    name: Powertrain
    scope: Engine, e-drive, transmission, drivetrain, fuel and exhaust systems, start-stop
    weight: 14
    certification_trigger: true
    links:
      - {to: body_structure, likelihood: 0.4, impact: 0.3}
      - {to: thermal_hvac, likelihood: 0.6, impact: 0.3}
      - {to: ee_architecture, likelihood: 0.6, impact: 0.3}
      - {to: software_hmi, likelihood: 0.7, impact: 0.2}
      - {to: chassis, likelihood: 0.4, impact: 0.2}
  - key: hv_battery
    name: HV battery
    scope: High-voltage battery, electric range, preconditioning
    weight: 10
    certification_trigger: true
    links:
      - {to: body_structure, likelihood: 0.8, impact: 0.5}
      - {to: thermal_hvac, likelihood: 0.9, impact: 0.6}
      - {to: ee_architecture, likelihood: 0.8, impact: 0.5}
      - {to: charging, likelihood: 0.9, impact: 0.7}
      - {to: chassis, likelihood: 0.6, impact: 0.3}
      - {to: software_hmi, likelihood: 0.7, impact: 0.2}
  - key: thermal_hvac
    name: Thermal / HVAC
    scope: Cabin climate, heating, cooling and ventilation hardware
    weight: 6
    certification_trigger: false
    links:
      - {to: ee_architecture, likelihood: 0.4, impact: 0.2}
  - key: ee_architecture
    name: E/E architecture
    scope: Wiring, power supply, 12 V battery, keys and access hardware, sensors, cameras, connectivity and audio hardware
    weight: 9
    certification_trigger: false
    links:
      - {to: software_hmi, likelihood: 0.8, impact: 0.4}
  - key: software_hmi
    name: Software / HMI
    scope: Operating system, displays and their content, apps, voice, navigation, connected and remote services, driver assistance functions
    weight: 10
    certification_trigger: false
    links:
      - {to: ee_architecture, likelihood: 0.2, impact: 0.1}
  - key: interior_console
    name: Interior / console
    scope: Cockpit, instrument panel, centre console, controls and stalks, storage, trims, ambient and interior lighting, steering wheel
    weight: 7
    certification_trigger: false
    links:
      - {to: ee_architecture, likelihood: 0.4, impact: 0.1}
      - {to: thermal_hvac, likelihood: 0.2, impact: 0.1}
      - {to: software_hmi, likelihood: 0.6, impact: 0.1}
      - {to: seats, likelihood: 0.3, impact: 0.2}
  - key: seats
    name: Seats
    scope: Seats, seat heating and ventilation, massage, memory, lumbar support, headrests, child seats
    weight: 5
    certification_trigger: false
    links:
      - {to: ee_architecture, likelihood: 0.5, impact: 0.1}
      - {to: thermal_hvac, likelihood: 0.5, impact: 0.15}
      - {to: software_hmi, likelihood: 0.6, impact: 0.1}
  - key: exterior_design
    name: Exterior design
    scope: Styling, bumpers, grille, exterior lighting look, mirrors, exterior trim
    weight: 6
    certification_trigger: false
    links:
      - {to: ee_architecture, likelihood: 0.4, impact: 0.1}
      - {to: body_structure, likelihood: 0.2, impact: 0.1}
  - key: paint_color
    name: Paint / colour
    scope: Paint, colour range and finishes on the existing paint line
    weight: 1
    certification_trigger: false
    links:
      - {to: exterior_design, likelihood: 0.1, impact: 0.05}
  - key: charging
    name: Charging
    scope: Charging socket and cover, cables, wallbox and home charging, public charging, bidirectional charging
    weight: 4
    certification_trigger: false
    links: []
