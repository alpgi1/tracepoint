# Authored mapping of every canonical VFC level-2 theme (config/taxonomy/vfc_level2.yaml, 225
# names) to one CPM subsystem (config/cpm/subsystems.yaml) or to none. Every canonical name must
# appear exactly once, either under a subsystem or under `unassigned`.
#
# ASSUMPTION (effort rule 50): the assistant's first mapping, 2026-10-11, to be checked by a
# mentor or BMW engineering. Principle: functions and interfaces go to software_hmi, physical
# sensors, keys, power and connectivity hardware to ee_architecture, cockpit hardware and
# controls to interior_console, closures and glazing to body_structure. The themes keep their
# customer domain (config/taxonomy/domain_map.yaml); this file adds the engineering view.
