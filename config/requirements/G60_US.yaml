# Requirements for the BMW 5 Series Sedan (G60), market US.
# Derived from the findings of the G60 US scope by the requirement agent (offline by the
# assistant, D-060). Study scores: US 2025 study, 1-7 derived means; "peer" = mean of the other
# BMW models in the same market (G70). Complaint shares: share of all complaint rows of the
# market (2,625). Targets marked "assumption" are proposals for the PM, not measured values.
vehicle: G60
market: US
author: assistant:claude-opus-5-5
requirements:
  - id: REQ-G60-US-IC-01
    domain: interior_comfort
    title: Front and rear seats comfortable for long drives across body sizes
    statement: >-
      The front seats shall allow a pain-free two-hour drive for drivers from 1.60 m to 1.90 m,
      including a lumbar support that can be set completely flat, and the rear seat cushion and
      backrest shall match the comfort of the front seats.
    recommend: true
    recommend_rationale: >-
      Seats are the largest complaint theme of the interior (62 complaint rows, 2.4 % of all US
      complaints, level A) and both study attributes sit below the peer: front seat comfort
      5.74 vs 6.04, rear seat comfort 5.27 vs 6.24. Verbatims name back pain, firmness and a
      lumbar support that cannot be flattened.
    horizon: H1
    horizon_rationale: Cushion, contour and lumbar calibration change within the life-cycle impulse; no new architecture needed.
    markets: [US]
    findings:
      - {id: FND-G60-US-VOC-seats, role: primary}
      - {id: FND-G60-US-MET-us_2025-seat_comfort, role: supporting}
      - {id: FND-G60-US-MET-us_2025-rear_seat_comfort, role: supporting}
      - {id: FND-G60-US-VOC-adjustment_of_lower_lumbar_support, role: supporting}
      - {id: FND-G60-US-EQ-seats, role: context}
    criteria:
      - {market: US, metric: Study front seat comfort (1-7), target: ">= 6.0 (today 5.74, peer 6.04)", method: Next US customer study wave, basis: evidence}
      - {market: US, metric: Study rear seat comfort (1-7), target: ">= 6.0 (today 5.27, peer 6.24)", method: Next US customer study wave, basis: evidence}
      - {market: US, metric: Share of seat complaint rows, target: "<= 1.2 % of complaint rows (today 2.4 %)", method: "Customer feedback sources A-D, rolling 6 months", basis: assumption}
      - {market: US, metric: Lumbar support travel, target: Can be set to a completely flat position, method: Seat test, basis: evidence}
    assumptions:
      - Study scores of the next wave are comparable with the 2025 wave.
    uncertainties:
      - Comfort perception differs between ICE (71 rows) and BEV (38 rows) buyers; the split is small.

  - id: REQ-G60-US-ID-01
    domain: infotainment_digital
    title: Frequently used functions reachable with one touch or a physical control
    statement: >-
      Climate temperature and fan, seat and steering wheel heating, drive mode, start-stop,
      assistance on/off, volume, map and phone shall each be operable with one touch or a
      physical control while driving, without leaving the current screen.
    recommend: true
    recommend_rationale: >-
      The operating concept is a level-A recurring complaint (53 rows, 39 of them usability) and
      is linked to the study attribute infotainment menu structure (4.88). Touch screen (35
      rows) and instrument cluster (38 rows) complaints repeat the same pattern: functions are
      buried in menus and pull the eyes off the road.
    horizon: H1
    horizon_rationale: Mostly software (shortcut layer, widget placement); physical controls only where the panel allows them in the life-cycle impulse.
    markets: [US]
    findings:
      - {id: FND-G60-US-VOC-operating_concept_operating_system, role: primary}
      - {id: FND-G60-US-MET-us_2025-infotainment_menu_structure, role: supporting}
      - {id: FND-G60-US-VOC-touch_screen_operation, role: supporting}
      - {id: FND-G60-US-VOC-instrument_cluster, role: supporting}
    criteria:
      - {market: US, metric: Touches to reach each of the ten listed functions while driving, target: "<= 1", method: HMI test protocol, basis: assumption}
      - {market: US, metric: Study infotainment menu structure (1-7), target: ">= 5.3 (today 4.88)", method: Next US customer study wave, basis: assumption}
      - {market: US, metric: Share of operating-concept complaint rows, target: "<= 1.0 % (today 2.0 %)", method: "Customer feedback, rolling 6 months", basis: assumption}
    uncertainties:
      - Part of the criticism is unfamiliarity; onboarding (REQ-G60-US-GE-01) may reduce it without HMI changes.

  - id: REQ-G60-US-IC-02
    domain: interior_comfort
    title: Climate control direct, strong enough for US heat, and remembers its settings
    statement: >-
      Temperature and fan speed shall have a physical or always-visible control; recirculation,
      zone sync and seat-ventilation defaults shall persist per driver profile across drives;
      the system shall cool the cabin from a heat-soaked state within an agreed time.
    recommend: true
    recommend_rationale: >-
      Climate setting is a level-A complaint (24 rows) supported by the study attribute climate
      controls usability (4.80); blower (19) and control panel (17) complaints add hidden vents,
      weak airflow and settings that reset after every drive.
    horizon: H1
    horizon_rationale: Persistence and control placement are software; vent and blower tuning fit the life-cycle impulse.
    markets: [US]
    findings:
      - {id: FND-G60-US-VOC-air_conditioning_setting, role: primary}
      - {id: FND-G60-US-MET-us_2025-climate_controls_usability, role: supporting}
      - {id: FND-G60-US-VOC-blower_function, role: supporting}
      - {id: FND-G60-US-VOC-air_conditioning_control_panel, role: supporting}
      - {id: FND-G60-US-VOC-vehicle_climatization, role: supporting}
    criteria:
      - {market: US, metric: Study climate controls usability (1-7), target: ">= 5.3 (today 4.80)", method: Next US customer study wave, basis: assumption}
      - {market: US, metric: Settings kept after ignition off, target: "Recirculation, sync and seat ventilation default kept per profile", method: Function test, basis: evidence}
      - {market: US, metric: Cabin cool-down from 60 °C soak to 25 °C, target: "<= 10 min (to be validated)", method: Climate chamber test, basis: assumption}

  - id: REQ-G60-US-PR-01
    domain: powertrain_range_charging
    title: Auto start-stop can be switched off permanently by the driver
    statement: >-
      Drivers of ICE and mild-hybrid variants shall be able to switch auto start-stop off with
      one control and keep it off across drives in their profile; the restart shall not jolt the
      car.
    recommend: true
    recommend_rationale: >-
      45 complaint rows, all from ICE drivers (1.7 % of US complaints): the function cannot be
      disabled permanently, cuts in too early and feels harsh and unsafe at intersections.
    horizon: H1
    horizon_rationale: Software setting and calibration, deliverable over the air.
    markets: [US]
    findings:
      - {id: FND-G60-US-VOC-automatic_engine_start_stop_function_msa, role: primary}
    criteria:
      - {market: US, metric: Start-stop off setting kept after ignition off, target: "Yes, per driver profile", method: Function test, basis: evidence}
      - {market: US, metric: Start-stop complaint rows, target: "<= 10 per 6 months (today 45)", method: Customer feedback, basis: assumption}
    uncertainties:
      - Fuel economy certification credits may constrain a persistent off setting; legal check needed.

  - id: REQ-G60-US-PR-02
    domain: powertrain_range_charging
    title: Reliable range prediction and cold-weather range guidance for BEV and PHEV
    statement: >-
      The displayed remaining range shall stay within an agreed tolerance of the real range in
      cold weather, and the car shall explain the expected winter range and the effect of
      pre-conditioning before a trip.
    recommend: true
    recommend_rationale: >-
      Electric range is the second-largest powertrain complaint (67 rows, 2.6 %, 83 of them BEV);
      verbatims report estimates that are "off" and range that collapses in winter.
    horizon: H1
    horizon_rationale: Range estimation and guidance are software.
    markets: [US]
    findings:
      - {id: FND-G60-US-VOC-electric_range, role: primary}
      - {id: FND-G60-US-VOC-high_voltage_battery, role: supporting}
    criteria:
      - {market: US, metric: Deviation of displayed vs actual range at 0 °C, target: "<= 10 %", method: Fleet data analysis, basis: assumption}
      - {market: US, metric: Winter range guidance in navigation, target: Shown before departure when the trip exceeds 70 % of predicted range, method: Function test, basis: assumption}

  - id: REQ-G60-US-PR-03
    domain: powertrain_range_charging
    title: More real-world electric range in the successor generation
    statement: >-
      The successor of the i5 shall offer a usable real-world range that covers typical US
      long-distance stages without a charging stop, including in cold weather.
    recommend: true
    recommend_rationale: >-
      Range wishes (17 rows) and usability complaints (50 rows) ask for 350 to 400 miles; the
      battery capacity of the current generation cannot be raised within the life cycle.
    horizon: H2
    horizon_rationale: Needs a new cell and pack generation.
    markets: [US]
    findings:
      - {id: FND-G60-US-VOC-electric_range, role: primary}
    criteria:
      - {market: US, metric: EPA range of the volume BEV variant, target: ">= 350 mi", method: Homologation, basis: assumption}
      - {market: US, metric: Range at -7 °C, target: ">= 75 % of EPA range", method: Cold-weather test, basis: assumption}
    assumptions:
      - Customer wishes of 350 to 400 miles in the verbatims represent the US BEV buyer.

  - id: REQ-G60-US-PR-04
    domain: powertrain_range_charging
    title: Dependable public fast charging on US trips
    statement: >-
      BEV owners shall be able to use the Tesla Supercharger (NACS) network without improvising,
      the route planner shall prefer stations that are reported working, and the car shall hold
      its advertised peak charging power for a meaningful part of the session.
    recommend: true
    recommend_rationale: >-
      Public charging draws 55 complaint rows (65 BEV mentions) and battery charging 31 more:
      broken stations, no NACS access, slow sessions and charge cut-offs make long trips
      stressful.
    horizon: H1
    horizon_rationale: Adapter, network agreement and route-planner logic do not need a new vehicle generation.
    markets: [US]
    findings:
      - {id: FND-G60-US-VOC-public_charging_external_providers, role: primary}
      - {id: FND-G60-US-VOC-charge_high_voltage_battery, role: supporting}
      - {id: FND-G60-US-EQ-charge_high_voltage_battery, role: context}
    criteria:
      - {market: US, metric: NACS access, target: Adapter supplied or available at delivery; Supercharger usable from the car, method: Offer check, basis: evidence}
      - {market: US, metric: Planned stops at stations reported out of order, target: "<= 5 %", method: Route-planner logs, basis: assumption}
      - {market: US, metric: Charging complaint rows, target: "-50 % within 12 months", method: Customer feedback, basis: assumption}
    uncertainties:
      - Third-party network reliability is outside BMW's direct control.

  - id: REQ-G60-US-PR-05
    domain: powertrain_range_charging
    title: Charging flap opens reliably in every condition
    statement: The charge port cover shall open on the first request whenever the car is unlocked, including in frost.
    recommend: true
    recommend_rationale: 20 complaint rows with 13 defects (BEV 19); owners report being stranded because the flap stays locked.
    horizon: H1
    horizon_rationale: Field fix of the actuator and its software.
    markets: [US]
    findings:
      - {id: FND-G60-US-VOC-opening_closing_charging_socket_cover, role: primary}
    criteria:
      - {market: US, metric: Flap opening success rate, target: ">= 99.9 % down to -20 °C", method: Endurance and climate test, basis: assumption}
      - {market: US, metric: Defect reports on the flap, target: 0 in the next feedback wave, method: Customer feedback, basis: assumption}

  - id: REQ-G60-US-SP-01
    domain: space_practicality
    title: Hands-free tailgate opens on the first kick and closes from inside
    statement: >-
      The hands-free tailgate shall open on the first foot movement and the trunk shall have a
      close button on the lid.
    recommend: true
    recommend_rationale: >-
      Non-contact trunk opening is one of the largest single usability complaints (44 rows, 39
      usability); trunk lid open/close adds 18 rows with 9 defects.
    horizon: H1
    horizon_rationale: Sensor calibration and a close button fit the life-cycle impulse.
    markets: [US]
    findings:
      - {id: FND-G60-US-VOC-non_contact_trunk_lid_opening, role: primary}
      - {id: FND-G60-US-VOC-trunk_lid_open_close, role: supporting}
    criteria:
      - {market: US, metric: First-attempt opening rate, target: ">= 95 %", method: User test with 30 participants, basis: assumption}
      - {market: US, metric: Close button on the tailgate, target: Present on every variant with power tailgate, method: Offer check, basis: evidence}

  - id: REQ-G60-US-SP-02
    domain: space_practicality
    title: Practical storage for everyday items
    statement: >-
      The cabin shall provide seat-back pockets, a sunglasses holder, a covered console tray and a
      glove box and door pockets that take a bottle and an umbrella.
    recommend: true
    recommend_rationale: >-
      Storage compartments (28 rows, half of them wishes) and front centre console (30 rows) are
      level-A findings supported by the study attribute interior storage (5.15 vs peer 5.33);
      owners miss the removed seat-back pockets and sunglasses holder.
    horizon: H1
    horizon_rationale: Trim parts within the life-cycle impulse.
    markets: [US]
    findings:
      - {id: FND-G60-US-VOC-storage_compartments, role: primary}
      - {id: FND-G60-US-VOC-center_console_front, role: primary}
      - {id: FND-G60-US-MET-us_2025-interior_storage, role: supporting}
      - {id: FND-G60-US-VOC-glove_box, role: supporting}
      - {id: FND-G60-US-VOC-cupholder, role: supporting}
    criteria:
      - {market: US, metric: Study interior storage (1-7), target: ">= 5.5 (today 5.15, peer 5.33)", method: Next US customer study wave, basis: assumption}
      - {market: US, metric: Seat-back pockets and sunglasses holder, target: Present on every variant, method: Offer check, basis: evidence}

  - id: REQ-G60-US-SP-03
    domain: space_practicality
    title: Keyless access on all four doors and easy door handling
    statement: >-
      Comfort access shall lock and unlock from all four door handles, the doors shall close
      without slamming and the handles shall be easy to find in the dark.
    recommend: true
    recommend_rationale: >-
      Door open/close is level A (31 rows) and linked to the study attribute rear entry/exit
      (5.41 vs 6.0); comfort access (30 rows, 17 wishes) and lock/unlock (38 rows) complain
      that the rear doors lost the touch sensor of earlier generations.
    horizon: H1
    horizon_rationale: Rear handle sensors and closing-force tuning fit the life-cycle impulse.
    markets: [US]
    findings:
      - {id: FND-G60-US-VOC-door_open_close, role: primary}
      - {id: FND-G60-US-VOC-comfort_access, role: supporting}
      - {id: FND-G60-US-VOC-vehicle_lock_unlock, role: supporting}
      - {id: FND-G60-US-MET-us_2025-entry_exit_rear, role: supporting}
    criteria:
      - {market: US, metric: Doors with comfort-access sensor, target: 4 of 4 where comfort access is fitted, method: Offer check, basis: evidence}
      - {market: US, metric: Door closing energy, target: Closes fully without slamming (value to be set by engineering), method: Door test, basis: assumption}
      - {market: US, metric: Study entry/exit rear (1-7), target: ">= 5.8 (today 5.41)", method: Next US customer study wave, basis: assumption}

  - id: REQ-G60-US-ID-02
    domain: infotainment_digital
    title: Phone integration that just works
    statement: >-
      Apple CarPlay shall connect to the phone of the active driver profile, play at the same
      loudness as the native sources, and wireless charging shall keep the phone charged without
      overheating.
    recommend: true
    recommend_rationale: >-
      Apple CarPlay (37 rows, 12 defects) and wireless charging (26 rows, level A, 11 defects,
      supported by the study attribute phone charging) are among the most frequent digital
      complaints; low CarPlay volume and the wrong phone connecting are repeated themes.
    horizon: H1
    horizon_rationale: Software and charger thermal management.
    markets: [US]
    findings:
      - {id: FND-G60-US-VOC-apple_carplay, role: primary}
      - {id: FND-G60-US-VOC-mobile_device_wireless_charging, role: primary}
      - {id: FND-G60-US-MET-us_2025-phone_charging, role: supporting}
      - {id: FND-G60-US-VOC-manage_pair_mobile_device_bluetooth, role: supporting}
    criteria:
      - {market: US, metric: CarPlay audio level vs native sources, target: Within 3 dB at the same volume step, method: Audio test, basis: assumption}
      - {market: US, metric: Phone connected at start, target: Phone of the active profile in >= 98 % of starts, method: Fleet telemetry, basis: assumption}
      - {market: US, metric: Wireless charging with navigation running, target: Battery level does not drop over 60 min at 30 °C cabin, method: Lab test, basis: assumption}

  - id: REQ-G60-US-ID-03
    domain: infotainment_digital
    title: Driver profiles and settings survive updates and shared use
    statement: >-
      Personal settings shall survive over-the-air updates; each profile shall support at least
      two keys or phones, and the car shall recognise the right driver when two key holders
      approach together.
    recommend: true
    recommend_rationale: >-
      Driver profile complaints (25 rows) and software update complaints (15 rows) report seat
      memories, wake words and assistance settings wiped by updates and the wrong profile loaded.
    horizon: H1
    horizon_rationale: Software.
    markets: [US]
    findings:
      - {id: FND-G60-US-VOC-driver_profile, role: primary}
      - {id: FND-G60-US-VOC-remote_software_upgrade_rsu, role: supporting}
      - {id: FND-G60-US-VOC-digital_key, role: supporting}
    criteria:
      - {market: US, metric: User settings kept after an OTA update, target: 100 % of profile settings, method: Update regression test, basis: evidence}
      - {market: US, metric: Keys or phones per profile, target: ">= 2", method: Function test, basis: evidence}

  - id: REQ-G60-US-IC-03
    domain: interior_comfort
    title: Interior materials that match the price class
    statement: >-
      Door panels, dashboard and trim within reach shall use soft-touch or leather materials, and
      a full-leather upholstery option shall be offered.
    recommend: true
    recommend_rationale: >-
      Upholstery and trim is level A (20 rows) and supported by the study attribute interior
      material quality (5.62 vs 5.95); door panels add 19 rows. Owners compare the cabin with the
      previous generation and with Audi.
    horizon: H1
    horizon_rationale: Material and option changes within the life-cycle impulse.
    markets: [US]
    findings:
      - {id: FND-G60-US-VOC-upholstery_interior_trim, role: primary}
      - {id: FND-G60-US-MET-us_2025-interior_material_quality, role: supporting}
      - {id: FND-G60-US-VOC-door_finisher_panel_front, role: supporting}
      - {id: FND-G60-US-EQ-upholstery_interior_trim, role: context}
    criteria:
      - {market: US, metric: Study interior material quality (1-7), target: ">= 5.95 (today 5.62, peer 5.95)", method: Next US customer study wave, basis: evidence}
      - {market: US, metric: Leather upholstery option, target: Available on every variant, method: Offer check, basis: assumption}

  - id: REQ-G60-US-GE-01
    domain: general
    title: Guided onboarding for a feature-rich car
    statement: >-
      Every new owner shall get an in-car guided tour and a searchable, model-specific help
      function that explains the ten most used functions within the first week.
    recommend: true
    recommend_rationale: >-
      The largest single complaint cluster (98 rows, 63 usability) is about the car being hard to
      figure out; owner's manual complaints (16 rows) add that the manual is hard to search.
    horizon: H1
    horizon_rationale: Software and content.
    markets: [US]
    findings:
      - {id: FND-G60-US-VOC-body_equipment_overall_technology, role: primary}
      - {id: FND-G60-US-VOC-owner_s_manual, role: supporting}
    criteria:
      - {market: US, metric: Owners who completed the guided tour in week 1, target: ">= 60 %", method: Telemetry, basis: assumption}
      - {market: US, metric: Complaint rows about complexity, target: "-30 % within 12 months", method: Customer feedback, basis: assumption}

  - id: REQ-G60-US-DD-01
    domain: driving_dynamics
    title: Personal drive mode that is really personal
    statement: >-
      The personal mode shall let the driver combine steering, suspension, throttle, sound and
      energy settings freely, hide unused modes and start in the last chosen mode.
    recommend: true
    recommend_rationale: >-
      My Modes draws 36 complaint rows, 15 of them wishes: owners want to start in sport or
      efficient mode and to configure the personal mode instead of fixed presets.
    horizon: H1
    horizon_rationale: Software.
    markets: [US]
    findings:
      - {id: FND-G60-US-VOC-my_modes_driving_experience, role: primary}
    criteria:
      - {market: US, metric: Mode kept after ignition off, target: Last mode per profile, method: Function test, basis: evidence}
      - {market: US, metric: Configurable parameters in personal mode, target: "Steering, damping, throttle, sound, energy", method: Function test, basis: assumption}

  - id: REQ-G60-US-DD-02
    domain: driving_dynamics
    title: Progressive brake pedal feel and predictable recuperation
    statement: >-
      Brake pedal response shall be progressive without an initial grab, and lifting off the
      accelerator shall decelerate the car predictably, with an option for one-pedal driving to
      a standstill.
    recommend: true
    recommend_rationale: >-
      Braking draws 37 complaint rows (28 usability: grabbing, poor modulation) and recuperation
      13 rows asking for consistent engine braking and a full stop in one-pedal mode.
    horizon: H1
    horizon_rationale: Brake-by-wire and recuperation calibration.
    markets: [US]
    findings:
      - {id: FND-G60-US-VOC-braking, role: primary}
      - {id: FND-G60-US-VOC-brake_energy_regeneration_recuperation, role: supporting}
    criteria:
      - {market: US, metric: Braking complaint rows, target: "<= 15 per 6 months (today 37)", method: Customer feedback, basis: assumption}
      - {market: US, metric: One-pedal stop, target: Car stops and holds without the brake pedal in the strongest mode, method: Function test, basis: assumption}

  - id: REQ-G60-US-DD-03
    domain: driving_dynamics
    title: Keep the handling and ride character in the next generation
    statement: The successor shall keep the handling precision and ride composition that customers praise today.
    recommend: true
    recommend_rationale: >-
      Handling and riding is the strongest praise theme (210 likes) and handling/manoeuvrability
      scores above the peer (6.06 vs 5.62); a strength to protect, not to change.
    horizon: H2
    horizon_rationale: Applies to the chassis of the successor generation.
    markets: [US]
    findings:
      - {id: FND-G60-US-VOC-STRENGTH-handling_riding, role: primary}
      - {id: FND-G60-US-MET-STRENGTH-us_2025-handling_manoeuvrability, role: supporting}
    criteria:
      - {market: US, metric: Study handling/manoeuvrability (1-7), target: ">= 6.0 (today 6.06)", method: Customer study of the successor, basis: evidence}

  - id: REQ-G60-US-DA-01
    domain: driver_assistance
    title: Adaptive cruise control as standard and simple assistance controls
    statement: >-
      Adaptive cruise control shall be standard; following distance, lane keeping and
      assistance on/off shall be adjustable with one control while driving.
    recommend: true
    recommend_rationale: >-
      Active cruise control (23 rows) and parking assistant (22 rows) complaints mention paying
      extra for functions expected as standard and awkward controls; the catalogue offers
      Driving Assistant Plus only as an option (1,000 EUR, 0 of 10 variants standard).
    horizon: H1
    horizon_rationale: Hardware is fitted; standard content and HMI are a product decision.
    markets: [US]
    findings:
      - {id: FND-G60-US-VOC-active_cruise_control, role: primary}
      - {id: FND-G60-US-EQ-active_cruise_control, role: supporting}
      - {id: FND-G60-US-VOC-parking_assistant, role: supporting}
      - {id: FND-G60-US-VOC-lane_departure_warning, role: supporting}
    criteria:
      - {market: US, metric: Variants with adaptive cruise control as standard, target: All, method: Offer check, basis: evidence}
      - {market: US, metric: Gap adjustment while driving, target: One control on the steering wheel, method: Function test, basis: assumption}
    uncertainties:
      - The catalogue is the German price list; US standard content may differ.

  - id: REQ-G60-US-ID-04
    domain: infotainment_digital
    title: Factory CD player
    statement: Offer a factory CD player.
    recommend: false
    recommend_rationale: >-
      Seven explicit wishes, all from ICE owners; physical media is declining and the cabin has
      no package space for it. Kept visible so the PM can confirm the rejection.
    horizon: H1
    horizon_rationale: Would only be possible as an accessory.
    markets: [US]
    findings:
      - {id: FND-G60-US-VOC-cd_dvd_changer_playback, role: primary}
    criteria:
      - {market: US, metric: Not applicable, target: Not recommended, method: PM confirmation, basis: assumption}
excluded:
  - {finding: FND-G60-US-MET-us_2025-affordability, reason: "Pricing; outside the scope of product requirements (challenge brief)."}
