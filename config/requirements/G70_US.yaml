# Requirements for the BMW 7 Series Sedan (G70), market US.
# Derived from the findings of the G70 US scope by the requirement agent (offline by the
# assistant, D-060). Study scores: US 2025 study, 1-7 derived means; "peer" = mean of the other
# BMW models in the same market (G60). Complaint shares: share of all complaint rows of the
# market. Targets marked "assumption" are proposals for the PM, not measured values.
vehicle: G70
market: US
author: assistant:claude-opus-5-5
requirements:
  - id: REQ-G70-US-IC-01
    domain: interior_comfort
    title: Automatic doors that never open unintentionally while driving
    statement: >-
      The electric doors shall not open from an inside button while the car is moving or a gear
      is engaged, shall start moving within an agreed delay, and shall close reliably from
      outside with a clearly placed button.
    recommend: true
    recommend_rationale: >-
      Automatic doors draw 40 complaint rows (9 defects, 30 usability) next to 45 likes. Several
      owners report that a knee touches the inside button and the door opens while driving: a
      safety risk on a flagship feature.
    horizon: H1
    horizon_rationale: Interlock logic is software; button guard or relocation fits the life-cycle impulse.
    markets: [US]
    findings:
      - {id: FND-G70-US-VOC-automatic_doors, role: primary}
    criteria:
      - {market: US, metric: Door opening from inside button above walking speed or in gear, target: Not possible, method: Function and safety test, basis: evidence}
      - {market: US, metric: Delay from button press to door movement, target: "<= 0.5 s", method: Function test, basis: assumption}
      - {market: US, metric: Automatic door defect rows, target: 0 in the next feedback wave, method: Customer feedback, basis: assumption}

  - id: REQ-G70-US-ID-01
    domain: infotainment_digital
    title: Intuitive controls for a flagship driver
    statement: >-
      The frequently used functions (climate, seat functions, drive mode, start-stop, assistance,
      audio source and volume, navigation zoom) shall be operable with one touch, a physical
      control or a reliable voice command, without searching through apps.
    recommend: true
    recommend_rationale: >-
      The operating concept is the largest digital complaint (66 rows, 62 usability, level A) and
      the study puts controls intuitiveness at 4.36 vs peer 5.20 and controls usability at 4.51 vs
      5.12; touch screen complaints (39 rows, level A) say the same.
    horizon: H1
    horizon_rationale: Software layer and shortcut concept; physical controls in the life-cycle impulse.
    markets: [US]
    findings:
      - {id: FND-G70-US-VOC-operating_concept_operating_system, role: primary}
      - {id: FND-G70-US-MET-us_2025-controls_intuitiveness, role: supporting}
      - {id: FND-G70-US-MET-us_2025-controls_usability, role: supporting}
      - {id: FND-G70-US-VOC-touch_screen_operation, role: supporting}
      - {id: FND-G70-US-MET-us_2025-screen_interface_usability, role: supporting}
    criteria:
      - {market: US, metric: Study controls intuitiveness (1-7), target: ">= 5.2 (today 4.36, peer 5.20)", method: Next US customer study wave, basis: evidence}
      - {market: US, metric: Study controls usability (1-7), target: ">= 5.1 (today 4.51)", method: Next US customer study wave, basis: evidence}
      - {market: US, metric: Touches for the listed functions while driving, target: "<= 1", method: HMI test protocol, basis: assumption}

  - id: REQ-G70-US-ID-02
    domain: infotainment_digital
    title: In-car connectivity that stays connected
    statement: >-
      The personal eSIM, Wi-Fi hotspot and connected services shall activate once and stay
      working with all major US carriers, including business plans, without repeated resets.
    recommend: true
    recommend_rationale: >-
      Personal eSIM is a large complaint cluster (42 rows, 14 defects) and connected drive /
      infotainment technology is level A (39 rows, 24 defects); Wi-Fi hotspot (4.51 vs 4.98) and
      connected services (4.83 vs 5.13) score below the peer. The rear theatre screen depends on it.
    horizon: H1
    horizon_rationale: Backend, carrier integration and software.
    markets: [US]
    findings:
      - {id: FND-G70-US-VOC-personal_esim, role: primary}
      - {id: FND-G70-US-VOC-connecteddrive_and_infotainment_overall_technolo, role: primary}
      - {id: FND-G70-US-VOC-wifi_hotspot, role: supporting}
      - {id: FND-G70-US-MET-us_2025-wifi_hotspot, role: supporting}
      - {id: FND-G70-US-MET-us_2025-connected_services, role: supporting}
    criteria:
      - {market: US, metric: eSIM activation success on first attempt, target: ">= 98 % across the four largest US carriers", method: Activation logs, basis: assumption}
      - {market: US, metric: Study Wi-Fi hotspot (1-7), target: ">= 5.0 (today 4.51, peer 4.98)", method: Next US customer study wave, basis: evidence}
    uncertainties:
      - Carrier-side provisioning is partly outside BMW's control.

  - id: REQ-G70-US-ID-03
    domain: infotainment_digital
    title: Rear theatre screen usable without blocking the driver's rear view
    statement: >-
      When the rear theatre screen or rear blind is deployed, the driver shall keep a full rear
      view (camera image in the interior mirror or on demand), and the screen shall be easy to
      operate and stream without cables.
    recommend: true
    recommend_rationale: >-
      Rear seat entertainment draws 34 complaint rows next to 20 likes: the lowered screen blocks
      the rear view and streaming often fails; 13 owners explicitly ask for a camera rear-view
      mirror, and rear visibility scores 5.23 vs 5.63.
    horizon: H1
    horizon_rationale: Camera mirror and software fit the life-cycle impulse.
    markets: [US]
    findings:
      - {id: FND-G70-US-VOC-rear_seat_entertainment, role: primary}
      - {id: FND-G70-US-VOC-interior_rearview_mirror, role: supporting}
      - {id: FND-G70-US-MET-us_2025-rear_visibility, role: supporting}
      - {id: FND-G70-US-VOC-rear_view_camera, role: supporting}
    criteria:
      - {market: US, metric: Rear view with theatre screen down, target: Camera image available in the interior mirror, method: Function test, basis: assumption}
      - {market: US, metric: Study rear visibility (1-7), target: ">= 5.6 (today 5.23, peer 5.63)", method: Next US customer study wave, basis: evidence}

  - id: REQ-G70-US-ID-04
    domain: infotainment_digital
    title: Seamless smartphone integration and audio worthy of the flagship
    statement: >-
      Apple CarPlay and Bluetooth shall pair once, connect to the active driver's phone and play
      at the same loudness as native sources; the premium audio systems shall deliver the bass and
      clarity customers expect at this price.
    recommend: true
    recommend_rationale: >-
      Apple CarPlay (28 rows, level A) and pairing (16 rows) complaints match the study gaps in
      smartphone integration (4.79 vs 5.49) and phone pairing (5.03 vs 5.59); audio is level A
      (27 rows) with bass 4.97 vs 5.59 and clarity 5.06 vs 5.68.
    horizon: H1
    horizon_rationale: Software, tuning and speaker placement within the life-cycle impulse.
    markets: [US]
    findings:
      - {id: FND-G70-US-VOC-apple_carplay, role: primary}
      - {id: FND-G70-US-VOC-audio_mode_sound, role: primary}
      - {id: FND-G70-US-MET-us_2025-smartphone_integration, role: supporting}
      - {id: FND-G70-US-MET-us_2025-audio_bass, role: supporting}
      - {id: FND-G70-US-VOC-manage_pair_mobile_device_bluetooth, role: supporting}
    criteria:
      - {market: US, metric: Study smartphone integration (1-7), target: ">= 5.5 (today 4.79, peer 5.49)", method: Next US customer study wave, basis: evidence}
      - {market: US, metric: Study audio bass (1-7), target: ">= 5.6 (today 4.97, peer 5.59)", method: Next US customer study wave, basis: evidence}
      - {market: US, metric: CarPlay audio level vs native sources, target: Within 3 dB at the same volume step, method: Audio test, basis: assumption}

  - id: REQ-G70-US-ID-05
    domain: infotainment_digital
    title: Navigation and voice assistant that get it right the first time
    statement: >-
      Route guidance shall give lane advice early and clearly on multi-lane highways, and the
      voice assistant shall understand natural phrasing of common commands without exact wording.
    recommend: true
    recommend_rationale: >-
      Navigation is level A (28 rows) with the study at 4.85 vs peer 5.53; the personal assistant
      is level A (23 rows) linked to voice recognition (4.76 vs 4.99).
    horizon: H1
    horizon_rationale: Software over the air.
    markets: [US]
    findings:
      - {id: FND-G70-US-VOC-navigation, role: primary}
      - {id: FND-G70-US-VOC-intelligent_personal_assistant, role: primary}
      - {id: FND-G70-US-MET-us_2025-navigation, role: supporting}
      - {id: FND-G70-US-MET-us_2025-voice_recognition, role: supporting}
    criteria:
      - {market: US, metric: Study navigation (1-7), target: ">= 5.5 (today 4.85, peer 5.53)", method: Next US customer study wave, basis: evidence}
      - {market: US, metric: Voice command success on a 50-command natural-language test set, target: ">= 90 %", method: Voice test protocol, basis: assumption}

  - id: REQ-G70-US-IC-02
    domain: interior_comfort
    title: Climate system that cools a large cabin fast and lets passengers direct the air
    statement: >-
      The climate system shall cool the cabin quickly after sun soak, let front and rear occupants
      direct the airflow, and offer temperature and fan controls that do not require menus.
    recommend: true
    recommend_rationale: >-
      Vehicle climatisation (42 rows), blower (23) and air conditioning (20) are all level A; the
      study puts air conditioning performance at 4.48 vs peer 5.19 and climate control at 4.74 vs
      5.14. Owners in hot states describe the car as undriveable for minutes after parking.
    horizon: H1
    horizon_rationale: Vent design and blower calibration in the life-cycle impulse; controls in software.
    markets: [US]
    findings:
      - {id: FND-G70-US-VOC-vehicle_climatization, role: primary}
      - {id: FND-G70-US-VOC-blower_function, role: supporting}
      - {id: FND-G70-US-VOC-air_conditioning_overall_technology, role: supporting}
      - {id: FND-G70-US-MET-us_2025-air_conditioning_performance, role: supporting}
      - {id: FND-G70-US-MET-us_2025-climate_control, role: supporting}
    criteria:
      - {market: US, metric: Study air conditioning performance (1-7), target: ">= 5.2 (today 4.48, peer 5.19)", method: Next US customer study wave, basis: evidence}
      - {market: US, metric: Cabin cool-down from 60 °C soak to 25 °C, target: "<= 10 min (to be validated)", method: Climate chamber test, basis: assumption}
      - {market: US, metric: Adjustable airflow direction at front vents, target: "Yes", method: Design review, basis: evidence}

  - id: REQ-G70-US-IC-03
    domain: interior_comfort
    title: Robust glass roof with an opening option and blinds that work
    statement: >-
      The panoramic glass roof shall not crack in normal use, shall limit heat entry, and an
      opening sunroof shall be offered; the rear and side blinds shall operate by button and
      not get stuck.
    recommend: true
    recommend_rationale: >-
      The panorama glass roof draws 38 complaint rows with 14 defects (cracks, bubbles) and 17
      wishes for an opening roof; sun protection adds 27 rows (blinds stuck, operated only via the
      screen).
    horizon: H2
    horizon_rationale: An opening roof needs a body-in-white change; glass quality and blind fixes start in H1 but the full requirement lands with the successor.
    markets: [US]
    findings:
      - {id: FND-G70-US-VOC-panorama_glass_roof, role: primary}
      - {id: FND-G70-US-VOC-sun_protection, role: supporting}
    criteria:
      - {market: US, metric: Roof glass defect reports, target: 0 cracks without impact, method: Warranty data, basis: assumption}
      - {market: US, metric: Opening sunroof, target: Offered as option, method: Offer check, basis: evidence}
      - {market: US, metric: Blind operation, target: Physical button per blind; no stuck blind in endurance test, method: Function test, basis: assumption}

  - id: REQ-G70-US-PR-01
    domain: powertrain_range_charging
    title: Auto start-stop can be switched off permanently and restarts smoothly
    statement: >-
      The driver shall be able to keep auto start-stop off across drives with one control, the
      engine shall not stop before the car is stationary, and the restart shall not jolt the car.
    recommend: true
    recommend_rationale: >-
      43 complaint rows (28 usability, 13 wishes): the engine stops before standstill, restarts
      with a jolt and can only be avoided in sport mode; drivers describe it as unsafe at
      intersections.
    horizon: H1
    horizon_rationale: Calibration and software.
    markets: [US]
    findings:
      - {id: FND-G70-US-VOC-automatic_engine_start_stop_function_msa, role: primary}
    criteria:
      - {market: US, metric: Start-stop off setting kept after ignition off, target: "Yes, per driver profile", method: Function test, basis: evidence}
      - {market: US, metric: Engine stop before standstill, target: Never, method: Calibration test, basis: assumption}
    uncertainties:
      - Fuel economy certification may constrain a persistent off setting.

  - id: REQ-G70-US-PR-02
    domain: powertrain_range_charging
    title: Electric range that matches the flagship's long-distance role
    statement: >-
      The successor of the i7 shall offer a real-world range that covers long US highway stages
      in cold weather without range anxiety.
    recommend: true
    recommend_rationale: >-
      Electric range is level A (45 rows, 17 wishes for 350 to 400 miles); winter range below
      150 miles is reported, and fuel economy scores 4.99 vs 5.48.
    horizon: H2
    horizon_rationale: Needs the next battery generation.
    markets: [US]
    findings:
      - {id: FND-G70-US-VOC-electric_range, role: primary}
      - {id: FND-G70-US-MET-us_2025-fuel_economy, role: supporting}
    criteria:
      - {market: US, metric: EPA range of the BEV, target: ">= 350 mi", method: Homologation, basis: assumption}
      - {market: US, metric: Range at -7 °C, target: ">= 75 % of EPA range", method: Cold-weather test, basis: assumption}

  - id: REQ-G70-US-PR-03
    domain: powertrain_range_charging
    title: Easy and reliable public charging, including the Supercharger network
    statement: >-
      i7 owners shall be able to charge at Tesla Superchargers, register the included charging
      offer without help, and plan trips around stations that are reported working.
    recommend: true
    recommend_rationale: >-
      Public charging (33 rows) and charging the battery (20 rows) complaints describe broken
      stations, queues, failed registration for the free charging offer and no NACS adapter.
    horizon: H1
    horizon_rationale: Adapter, partner network and app.
    markets: [US]
    findings:
      - {id: FND-G70-US-VOC-public_charging_external_providers, role: primary}
      - {id: FND-G70-US-VOC-charge_high_voltage_battery, role: supporting}
    criteria:
      - {market: US, metric: NACS access, target: Adapter supplied at delivery, method: Offer check, basis: evidence}
      - {market: US, metric: Charging offer activation without dealer help, target: ">= 95 % of owners", method: App analytics, basis: assumption}

  - id: REQ-G70-US-QN-01
    domain: quality_nvh
    title: Fault-free first months of ownership
    statement: >-
      A new car shall reach the customer free of drivetrain, electrical and paint faults; repairs
      in the first three months shall be the exception, not the experience.
    recommend: true
    recommend_rationale: >-
      Drivetrain complaints (51 rows, 27 defects) and exterior complaints (43 rows, 27 defects:
      paint, trim) report breakdowns, warnings and long workshop stays in the first weeks;
      reliability (5.52 vs 5.92) and electrical reliability (5.18 vs 5.42) are below the peer.
    horizon: H1
    horizon_rationale: Launch quality measures in production and pre-delivery inspection.
    markets: [US]
    findings:
      - {id: FND-G70-US-VOC-drivetrain, role: primary}
      - {id: FND-G70-US-VOC-exterior, role: primary}
      - {id: FND-G70-US-MET-us_2025-reliability, role: supporting}
      - {id: FND-G70-US-MET-us_2025-electrical_reliability, role: supporting}
    criteria:
      - {market: US, metric: Study reliability (1-7), target: ">= 5.9 (today 5.52, peer 5.92)", method: Next US customer study wave, basis: evidence}
      - {market: US, metric: Workshop visits for faults in the first 90 days, target: "-50 % vs current model year", method: Warranty data, basis: assumption}

  - id: REQ-G70-US-DD-01
    domain: driving_dynamics
    title: Fully customisable personal drive mode
    statement: >-
      The personal mode shall let the driver combine suspension, steering, throttle, sound and
      energy settings, start in the last chosen mode and hide modes that are not used.
    recommend: true
    recommend_rationale: >-
      My Modes is level A (31 rows, 14 wishes) and linked to the study attribute customisation
      ease (4.34 vs peer 5.20).
    horizon: H1
    horizon_rationale: Software.
    markets: [US]
    findings:
      - {id: FND-G70-US-VOC-my_modes_driving_experience, role: primary}
      - {id: FND-G70-US-MET-us_2025-customisation_ease, role: supporting}
    criteria:
      - {market: US, metric: Study customisation ease (1-7), target: ">= 5.2 (today 4.34, peer 5.20)", method: Next US customer study wave, basis: evidence}
      - {market: US, metric: Mode kept after ignition off, target: Last mode per profile, method: Function test, basis: evidence}

  - id: REQ-G70-US-DD-02
    domain: driving_dynamics
    title: Confident braking, including under assisted driving
    statement: >-
      The brakes shall feel strong and progressive at highway speeds, and assisted driving shall
      slow down early and smoothly for slower traffic instead of braking late and hard.
    recommend: true
    recommend_rationale: >-
      Braking draws 33 complaint rows with 10 defects (weak stopping above 60 mph, late harsh
      braking in cruise); adaptive driving assist scores 5.32 vs 5.77.
    horizon: H1
    horizon_rationale: Brake system calibration and assistance software.
    markets: [US]
    findings:
      - {id: FND-G70-US-VOC-braking, role: primary}
      - {id: FND-G70-US-MET-us_2025-adaptive_driving_assist, role: supporting}
    criteria:
      - {market: US, metric: Braking complaint rows, target: "<= 12 per 6 months (today 33)", method: Customer feedback, basis: assumption}
      - {market: US, metric: Peak deceleration of ACC when approaching slower traffic, target: "<= 3 m/s² outside emergencies", method: Test track, basis: assumption}

  - id: REQ-G70-US-DA-01
    domain: driver_assistance
    title: Assistance and camera package as standard on the flagship
    statement: >-
      Adaptive cruise control with stop and go, surround view and front camera shall be standard
      on every G70, with following distance and lane keeping adjustable by one control.
    recommend: true
    recommend_rationale: >-
      Active cruise control is level A (23 rows), parking assistant (19) and surround view (7
      wishes) add that owners expect these on a 100k car; adaptive driving assist (5.32 vs 5.77)
      and parking cameras (5.46 vs 5.80) score below the peer.
    horizon: H1
    horizon_rationale: Standard-content decision; hardware exists.
    markets: [US]
    findings:
      - {id: FND-G70-US-VOC-active_cruise_control, role: primary}
      - {id: FND-G70-US-VOC-parking_assistant, role: supporting}
      - {id: FND-G70-US-VOC-surround_view, role: supporting}
      - {id: FND-G70-US-MET-us_2025-parking_camera_sensors, role: supporting}
    criteria:
      - {market: US, metric: Variants with ACC stop and go and surround view as standard, target: All, method: Offer check, basis: evidence}
      - {market: US, metric: Study parking cameras and sensors (1-7), target: ">= 5.8 (today 5.46)", method: Next US customer study wave, basis: evidence}

  - id: REQ-G70-US-EX-01
    domain: exterior_design
    title: Headlights that light the road like a flagship
    statement: >-
      The headlights shall offer strong low-beam reach and selective high-beam masking in the US
      as allowed by regulation, and lighting faults shall not occur in the first year.
    recommend: true
    recommend_rationale: >-
      Exterior lighting is level A (24 rows, 10 defects) and supported by headlight performance
      (5.55 vs 5.93); owners note that US cars lack the selective beam available elsewhere.
    horizon: H1
    horizon_rationale: Software activation where the hardware allows; fault fixes in production.
    markets: [US]
    findings:
      - {id: FND-G70-US-VOC-exterior_lighting, role: primary}
      - {id: FND-G70-US-MET-us_2025-headlight_performance, role: supporting}
    criteria:
      - {market: US, metric: Study headlight performance (1-7), target: ">= 5.9 (today 5.55, peer 5.93)", method: Next US customer study wave, basis: evidence}
      - {market: US, metric: Adaptive driving beam, target: Activated in the US where legally permitted, method: Offer check, basis: assumption}
    uncertainties:
      - Depends on the US adaptive driving beam regulation as applied to the current hardware.

  - id: REQ-G70-US-EX-02
    domain: exterior_design
    title: Calmer front design (split grille, smaller black areas)
    statement: Redesign the front with a less dominant grille and less black surface.
    recommend: false
    recommend_rationale: >-
      The grille draws 10 complaint rows and 18 design wishes, but exterior design is the
      strongest praise theme of the car (210 likes). The criticism is real but polarising; a
      redesign risks the main reason buyers chose the car. Kept visible for the PM's decision.
    horizon: H2
    horizon_rationale: Front-end design change belongs to the successor or the next life-cycle impulse.
    markets: [US]
    findings:
      - {id: FND-G70-US-VOC-radiator_grille, role: primary}
      - {id: FND-G70-US-VOC-exterior_design, role: supporting}
      - {id: FND-G70-US-VOC-STRENGTH-exterior_design, role: context}
    criteria:
      - {market: US, metric: Not applicable, target: Not recommended, method: PM confirmation, basis: assumption}

  - id: REQ-G70-US-SP-01
    domain: space_practicality
    title: Storage for phone, sunglasses and drinks
    statement: >-
      The cabin shall offer a phone place with the screen visible, a sunglasses holder, cup
      holders that hold different bottle sizes and more covered storage for the driver.
    recommend: true
    recommend_rationale: >-
      Storage compartments (20 rows) and front console (15 rows) complaints match the study gaps
      in phone storage (4.78 vs 5.47) and cup holders (4.80 vs 5.42).
    horizon: H1
    horizon_rationale: Trim parts in the life-cycle impulse.
    markets: [US]
    findings:
      - {id: FND-G70-US-VOC-storage_compartments, role: primary}
      - {id: FND-G70-US-MET-us_2025-phone_storage, role: supporting}
      - {id: FND-G70-US-MET-us_2025-cupholders, role: supporting}
      - {id: FND-G70-US-VOC-center_console_front, role: supporting}
    criteria:
      - {market: US, metric: Study phone storage (1-7), target: ">= 5.4 (today 4.78, peer 5.47)", method: Next US customer study wave, basis: evidence}
      - {market: US, metric: Study cup holders (1-7), target: ">= 5.4 (today 4.80, peer 5.42)", method: Next US customer study wave, basis: evidence}

  - id: REQ-G70-US-GE-01
    domain: general
    title: Personal onboarding for flagship owners
    statement: >-
      Every owner shall be offered a personal introduction (at delivery and again after four
      weeks) plus an in-car guided tour and a searchable model-specific manual.
    recommend: true
    recommend_rationale: >-
      The largest complaint cluster (89 rows, level A) is about complexity; owner's manual (22
      rows) and general enquiries (21 rows) ask for more guidance after delivery.
    horizon: H1
    horizon_rationale: Service and software content.
    markets: [US]
    findings:
      - {id: FND-G70-US-VOC-body_equipment_overall_technology, role: primary}
      - {id: FND-G70-US-VOC-owner_s_manual, role: supporting}
      - {id: FND-G70-US-VOC-general_enquiry_customer_feedback, role: supporting}
    criteria:
      - {market: US, metric: Owners offered a follow-up introduction after four weeks, target: 100 %, method: Dealer process audit, basis: assumption}
      - {market: US, metric: Complaint rows about complexity, target: "-30 % within 12 months", method: Customer feedback, basis: assumption}
excluded:
  - {finding: FND-G70-US-MET-us_2025-resale_value, reason: "Residual value; commercial topic, not a product requirement."}
