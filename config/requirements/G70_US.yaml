  - {finding: FND-G70-US-MET-us_2025-cost_of_ownership, reason: "Cost of ownership; commercial topic."}
  - {finding: FND-G70-US-MET-us_2025-price_deal, reason: "Price negotiation; sales process."}
  - {finding: FND-G70-US-MET-us_2025-warranty, reason: "Warranty terms; commercial topic."}
  - {finding: FND-G70-US-MET-us_2025-value_for_money, reason: "Value perception follows from the product requirements; no separate requirement."}
  - {finding: FND-G70-US-MET-us_2025-turning_radius, reason: "Integral active steering already exists as an option; an offer decision, covered in G2 of REQ-G70-US-DA-01 discussions."}
