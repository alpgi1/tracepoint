# Change profiles for the G60 US requirements (config/requirements/G60_US.yaml), input of the CPM
# effort engine (config/effort/model.yaml). Kept apart from the requirement file on purpose: an
# effort correction must not create a new requirement version and invalidate a G2 decision.
# own_impact = share of the subsystem's design redone; scale reference from the back-test: a new
# operating system release (OS 7) is software_hmi 0.4, new headlights and bumper are
# exterior_design 0.5. Every value is an assumption for engineering to correct (rule 50).
# portfolio_terms are searched in the option-list catalogues of all vehicles (rule 43).
vehicle: G60
market: US
author: assistant
profiles:
  - requirement: REQ-G60-US-IC-01
    changes:
      - {subsystem: seats, own_impact: 0.25, layer: K1, why: "Front and rear cushion foam, contour and lumbar travel on the existing seat structure"}
  - requirement: REQ-G60-US-ID-01
    changes:
      - {subsystem: software_hmi, own_impact: 0.1, layer: K2, why: "Shortcut layer and widget placement for ten functions"}
      - {subsystem: interior_console, own_impact: 0.1, layer: K2, why: "Physical controls where the panel allows them"}
  - requirement: REQ-G60-US-IC-02
    changes:
      - {subsystem: thermal_hvac, own_impact: 0.1, layer: K2, why: "Vent and blower tuning for heat-soak cool-down"}
      - {subsystem: interior_console, own_impact: 0.05, layer: K1, why: "Always-visible temperature and fan control"}
      - {subsystem: software_hmi, own_impact: 0.03, layer: K1, why: "Persist recirculation, sync and seat-ventilation defaults per profile"}
  - requirement: REQ-G60-US-PR-01
    changes:
      - {subsystem: software_hmi, own_impact: 0.02, layer: K0, why: "Persistent off setting in the driver profile (OTA)"}
